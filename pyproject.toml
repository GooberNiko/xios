[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xios"
version = "0.1.0"
description = "Adaptive-depth chat architecture: knowledge on disk, compute allocated at runtime"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
train = ["datasets>=2.14", "matplotlib>=3.7"]

[project.scripts]
xios = "xios.cli:main"

[tool.setuptools.packages.find]
include = ["xios*"]
